spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.username=pagos
spring.datasource.password=14693701
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



spring.cloud.config.import-check.enabled=false

application.config.kafka.topics.appointment-created=appointment-created
application.config.kafka.topics.payment-created=payment-created

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=appointment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# Propiedades JSON para el Deserializador
spring.kafka.properties.spring.json.trusted.packages=com.vdgarcia.events
spring.kafka.properties.spring.json.value.default.type=com.vdgarcia.events.AppointmentCreated


application.config.patient-url=http://localhost:8081/api/pacientes
application.config.doctor-url=http://localhost:8082/api/doctores