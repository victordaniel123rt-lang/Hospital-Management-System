spring.application.name=appointment-service
server.port = 8083

spring.datasource.url=jdbc:mariadb://localhost:3306/appointment?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1469370
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.cloud.config.import-check.enabled=false

application.config.kafka.topics.appointment-created=appointment-created
application.config.kafka.topics.payment-created=payment-created

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=appointment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# Propiedades JSON para el Deserializador
spring.kafka.properties.spring.json.trusted.packages=com.vdgarcia.events
spring.kafka.properties.spring.json.value.default.type=com.vdgarcia.events.AppointmentCreated


application.config.patient-url=http://localhost:8081/api/pacientes
application.config.doctor-url=http://localhost:8082/api/doctores
